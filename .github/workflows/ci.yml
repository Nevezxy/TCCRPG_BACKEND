name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Migrations e testes (PostgreSQL)
    runs-on: ubuntu-latest

    # O banco do CI é PostgreSQL, o mesmo da produção, e não SQLite — ver a
    # explicação em `app/settings_test.py`: o SQLite ignora
    # `SELECT ... FOR UPDATE`, então no SQLite os testes de compra da Loja e
    # do Comércio Livre passam sem exercitar nenhum bloqueio de linha.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tccrpg_ci
        ports:
          - 5432:5432
        # Sem isto o job começa antes do banco aceitar conexão.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: chave-apenas-para-o-ci
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tccrpg_ci
      DJANGO_SETTINGS_MODULE: app.settings_test

    steps:
      - uses: actions/checkout@v4

      # Django 6 exige Python >= 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Checagem do Django
        run: python manage.py check

      # Pega o caso de alguém mexer num model e esquecer a migration — o
      # deploy roda `migrate`, não `makemigrations`, então isso só apareceria
      # em produção, como um erro de coluna inexistente.
      - name: Migrations em falta
        run: python manage.py makemigrations --check --dry-run

      - name: Migrations aplicam do zero
        run: python manage.py migrate --noinput

      - name: Testes
        run: python manage.py test --noinput
